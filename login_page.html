<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learning Portal</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/account.css?v=5">

</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Learning Portal</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="/" class="hover:text-blue-200">Home</a></li>
                    <li><a href="/courses" class="hover:text-blue-200">Courses</a></li>
                    
                        <li><a href="/login" class="hover:text-blue-200">Login</a></li>
                        <li><a href="/register" class="hover:text-blue-200">Register</a></li>
                    
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        
            
        
        
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form id="login-form" method="POST" class="space-y-4">
        <input id="csrf_token" name="csrf_token" type="hidden" value="IjI1Y2NkOGUyOTY0OGI0ZGY3MDFiOTE4M2QyNTg5OWFmNTI2MTQ1Y2Qi.aCiDmQ.hiKKmb90dSB70nKeY83wtn7hW0Q">
        <div>
            <label class="block text-sm font-medium text-gray-700" for="email"><label for="email">Email</label></label>
            <input aria-describedby="email-error" class="mt-1 block w-full p-2 border rounded-md focus:ring focus:ring-blue-300" id="email" maxlength="255" minlength="4" name="email" required="required" type="text" value="">
            
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700" for="password"><label for="password">Password</label></label>
            <input aria-describedby="password-error" class="mt-1 block w-full p-2 border rounded-md focus:ring focus:ring-blue-300" id="password" minlength="6" name="password" required="required" type="password" value="">
            
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition-colors duration-200">Login</button>
    </form>
    <div class="mt-4 text-center space-y-2">
        <p>
            Don't have an account? <a href="/register" class="text-blue-600 hover:underline">Register</a>
        </p>
        <p>
            <a href="/reset_password" class="text-blue-600 hover:underline">Forgot Password?</a>
        </p>
    </div>
</div>
<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        try {
            const response = await fetch('/login', {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            if (response.ok) {
                console.log('Login successful, token:', data.access_token); // Debug
                localStorage.setItem('access_token', data.access_token);
                // Redirect to the provided URL with Authorization header
                const redirectUrl = data.redirect_url || '/';
                window.location.href = redirectUrl; // Rely on base.html interceptor for header
            } else {
                console.error('Login failed:', data.msg); // Debug
                const errorDiv = document.createElement('div');
                errorDiv.className = 'text-red-600 text-sm mt-2';
                errorDiv.textContent = data.msg || 'Login failed. Please try again.';
                form.insertBefore(errorDiv, form.firstChild);
            }
        } catch (error) {
            console.error('Error during login:', error);
            const errorDiv = document.createElement('div');
            errorDiv.className = 'text-red-600 text-sm mt-2';
            errorDiv.textContent = 'An error occurred. Please try again.';
            form.insertBefore(errorDiv, form.firstChild);
        }
    });
</script>

    </main>

    <footer class="bg-gray-800 text-white py-4">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 Learning Portal. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
